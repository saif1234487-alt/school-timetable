<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الجدول المدرسي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="text-center mb-4">إدارة المعلمين والحصص</h2>
        
        <div class="card p-4 shadow-sm mb-4">
            <h4>إضافة معلم جديد</h4>
            <form id="teacherForm">
                <div class="mb-3">
                    <label for="teacherName" class="form-label">اسم المعلم:</label>
                    <input type="text" id="teacherName" class="form-control" required placeholder="أدخل اسم المعلم">
                </div>
                
                <div class="mb-3">
                    <label for="teacherRestDay" class="form-label">يوم العطلة المخصص:</label>
                    <select id="teacherRestDay" class="form-select">
                        <option value="">بدون عطلة مخصصة</option>
                        <option value="السبت">السبت</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الإثنين">الإثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                        <option value="الجمعة">الجمعة</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="teacherMaxClasses" class="form-label">عدد الحصص الأسبوعية:</label>
                    <input type="number" id="teacherMaxClasses" class="form-control" placeholder="مثلاً: 18">
                </div>

                <button type="submit" class="btn btn-primary w-100">حفظ المعلم</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('teacherForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('teacherName').value,
                restDay: document.getElementById('teacherRestDay').value,
                maxClasses: document.getElementById('teacherMaxClasses').value
            };

            const res = await fetch('/api/teachers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert('تم حفظ المعلم بنجاح مع عطلته وعدد حصصه!');
                document.getElementById('teacherForm').reset();
            } else {
                alert('حدث خطأ أثناء الحفظ');
            }
        });
    </script>
</body>
</html>
